<div class="container">
  <div class="header">
    <h1>Welcome To Quantity Measurement</h1>
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>

  <div class="section">
    <p class="section-title">CHOOSE TYPE</p>

    <div class="types">
      <button class="type" [class.active]="currentType === 'length'" (click)="setType('length')">
        <span>📏</span>
<span>Length</span>
      </button>

      <button class="type" [class.active]="currentType === 'weight'" (click)="setType('weight')">
       <span>⚖️</span>
        <span>Weight</span>
      </button>

      <button
        class="type"
        [class.active]="currentType === 'temperature'"
        (click)="setType('temperature')"
      >
       <span>🌡️</span>
        <span>Temperature</span>
      </button>

      <button class="type" [class.active]="currentType === 'volume'" (click)="setType('volume')">
       <span>🧪</span>
        <span>Volume</span>
      </button>
    </div>
  </div>

  <div class="section">
    <p class="section-title">CHOOSE ACTION</p>

    <div class="actions">
      <button
        class="action"
        [class.active]="currentAction === 'compare'"
        (click)="setAction('compare')"
      >
        Comparison
      </button>

      <button
        class="action"
        [class.active]="currentAction === 'convert'"
        (click)="setAction('convert')"
      >
        Conversion
      </button>

      <button
        *ngIf="currentType !== 'temperature'"
        class="action"
        [class.active]="currentAction === 'add'"
        (click)="setAction('add')"
      >
        Add
      </button>

      <button
        *ngIf="currentType !== 'temperature'"
        class="action"
        [class.active]="currentAction === 'subtract'"
        (click)="setAction('subtract')"
      >
        Subtract
      </button>

      <button
        *ngIf="currentType !== 'temperature'"
        class="action"
        [class.active]="currentAction === 'divide'"
        (click)="setAction('divide')"
      >
        Divide
      </button>
    </div>
  </div>

  <div class="input-section">
    <div class="input-box">
      <label for="value1">Value 1</label>
      <input type="number" id="value1" [(ngModel)]="value1" placeholder="Enter value" />

      <label for="unit1">From Unit</label>
      <select id="unit1" [(ngModel)]="unit1">
        <option *ngFor="let unit of availableUnits" [value]="unit">{{ unit }}</option>
      </select>
    </div>

    <div class="operator">
      <span *ngIf="currentAction === 'compare'">=</span>
      <span *ngIf="currentAction === 'convert'">→</span>
      <span *ngIf="currentAction === 'add'">+</span>
      <span *ngIf="currentAction === 'subtract'">−</span>
      <span *ngIf="currentAction === 'divide'">÷</span>
    </div>

    <div class="input-box">
      <label for="value2">
        {{ currentAction === 'convert' ? 'Target Unit' : 'Value 2' }}
      </label>

      <input
        *ngIf="currentAction !== 'convert'"
        type="number"
        id="value2"
        [(ngModel)]="value2"
        placeholder="Enter value"
      />

      <label for="unit2">{{ currentAction === 'convert' ? 'To Unit' : 'To Unit' }}</label>
      <select id="unit2" [(ngModel)]="unit2">
        <option *ngFor="let unit of availableUnits" [value]="unit">{{ unit }}</option>
      </select>
    </div>
  </div>

  <div class="action-btn-container">
    <button id="calculateBtn" (click)="calculate()">CALCULATE</button>
  </div>

  <div class="result">
    <p class="section-title">RESULT</p>
    <h2>{{ resultText }}</h2>
  </div>

  <div class="history-section">
    <div class="history-header">
      <h2>History</h2>

      <div class="history-controls">
        <button type="button" (click)="loadAllHistory()">View All History</button>

        <select [(ngModel)]="selectedHistoryOperation">
          <option *ngFor="let op of historyOperations" [value]="op">
            {{ op }}
          </option>
        </select>

        <button type="button" (click)="loadFilteredHistory()">Filter History</button>
        <button type="button" (click)="hideHistory()">Hide</button>
      </div>
    </div>

    <div *ngIf="showHistory">
      <table *ngIf="historyList.length > 0" class="history-table">
        <thead>
          <tr>
            <th>Result</th>
            <th>Unit</th>
            <th>Operation</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of historyList">
            <td>
              {{
                item.unit === 'BOOLEAN'
                  ? (item.result == 1 ? 'TRUE' : 'FALSE')
                  : item.result
              }}
            </td>
            <td>{{ item.unit }}</td>
            <td>{{ item.operation }}</td>
            <td>{{ item.message }}</td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="historyList.length === 0" class="no-history">
        No history found.
      </p>
    </div>
  </div>
</div>
