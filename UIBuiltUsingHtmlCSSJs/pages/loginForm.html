<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantityMeasurementApp</title>

    <link rel="stylesheet" href="../style/loginStyle.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="container">
        <!-- LEFT PANEL -->
        <div class="left-panel">
          <div class="branding">
            <img src="../assests/image.png" alt="Quantity Measurement App" />
            <h2 class="app-title">QuantityMeasurementApp</h2>
    <p class="tagline">Compare • Convert • Calculate Units</p>
          </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
          <div class="form-card">
            <div class="tabs">
              <button id="loginTab" class="tab-btn active" type="button">
                LOGIN
              </button>
              <button id="signupTab" class="tab-btn" type="button">
                SIGNUP
              </button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="form active" novalidate>
              <h2>Welcome Back</h2>
              <p class="form-subtitle">Login to continue using your account</p>

              <div class="form-group">
                <label for="loginEmail">Email Id</label>
                <input
                  type="email"
                  id="loginEmail"
                  placeholder="Enter your email"
                />
              </div>

              <div class="form-group password-field">
                <label for="loginPassword">Password</label>
                <input
                  type="password"
                  id="loginPassword"
                  placeholder="Enter your password"
                />
                <i
                  class="fa-solid fa-eye-slash toggle-password"
                  data-target="loginPassword"
                ></i>
              </div>

              <div class="form-options">
                <label class="remember-me">
                  <input type="checkbox" id="rememberMe" />
                  <span>Remember me</span>
                </label>
              </div>

              <button type="submit" class="submit-btn">Login</button>

              <p class="switch-text">
                Don’t have an account?
                <span id="goToSignup">Sign up</span>
              </p>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="form" novalidate>
              <h2>Create Account</h2>
              <p class="form-subtitle">Sign up to start using the app</p>

              <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                  type="text"
                  id="fullName"
                  placeholder="Enter your full name"
                />
              </div>

              <div class="form-group">
                <label for="signupEmail">Email Id</label>
                <input
                  type="email"
                  id="signupEmail"
                  placeholder="Enter your email"
                />
              </div>

              <div class="form-group password-field">
                <label for="signupPassword">Password</label>
                <input
                  type="password"
                  id="signupPassword"
                  placeholder="Create password"
                />
                <i
                  class="fa-solid fa-eye-slash toggle-password"
                  data-target="signupPassword"
                ></i>
              </div>

              <div class="form-group">
                <label for="mobileNumber">Mobile Number</label>
                <input
                  type="text"
                  id="mobileNumber"
                  placeholder="Enter mobile number"
                />
              </div>

              <button type="submit" class="submit-btn">Signup</button>

              <p class="switch-text">
                Already have an account?
                <span id="goToLogin">Login</span>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="../script/loginScript.js"></script>
  </body>
</html>
